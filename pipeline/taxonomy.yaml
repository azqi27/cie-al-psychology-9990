# =====================================================================
# 9990 公益题库 — 分类体系 (taxonomy)
# 范围：2024–2026 考纲 · Paper 1 + Paper 2（首版切片）
# 本文件是 P1 阶段必须一次定稿的"单一事实来源"(single source of truth)。
# 题目记录的 topics[] / type_facet 字段均引用本文件的 id。
# =====================================================================

meta:
  syllabus_version: "2024-2026"
  papers_in_scope: [P1, P2]
  ui_language: zh          # 界面中文
  question_language: en    # 题目英文（与考试一致）
  site_name: cie-al-psychology-9990
  domain: ""               # 待定，先用 *.pages.dev
  display_mode: full       # Q1=A 全文模式；如需切换为索引模式改此处
  mark_scheme_shown: false # Q3=不展示 mark scheme，仅给原卷+题号溯源

# ---------------------------------------------------------------------
# 维度一：知识点 (Syllabus Topic)
# 用于筛选的"第一维"。id 为稳定字符串，前端/数据均引用它。
# group: p1 / p2 标明所属卷；kind: approach/study/debate/method/concept
# ---------------------------------------------------------------------
topics:

  # ===== Paper 1：Approaches, Issues and Debates =====
  # —— 四大视角 (Approaches) ——
  - id: approach.biological
    zh: 生物视角
    en: Biological approach
    group: p1
    kind: approach
  - id: approach.cognitive
    zh: 认知视角
    en: Cognitive approach
    group: p1
    kind: approach
  - id: approach.learning
    zh: 学习视角
    en: Learning approach
    group: p1
    kind: approach
  - id: approach.social
    zh: 社会视角
    en: Social approach
    group: p1
    kind: approach

  # —— 12 篇核心研究 (Core Studies, 按视角分组) ——
  - id: study.dement_kleitman
    zh: Dement & Kleitman（睡眠与梦）
    en: Dement & Kleitman (sleep and dreams)
    group: p1
    kind: study
    approach: biological
  - id: study.hassett
    zh: Hassett 等（猴子玩具偏好）
    en: Hassett et al. (monkey toy preferences)
    group: p1
    kind: study
    approach: biological
  - id: study.holzel
    zh: Hölzel 等（正念与脑扫描）
    en: Hölzel et al. (mindfulness and brain scans)
    group: p1
    kind: study
    approach: biological
  - id: study.andrade
    zh: Andrade（涂鸦）
    en: Andrade (doodling)
    group: p1
    kind: study
    approach: cognitive
  - id: study.baron_cohen
    zh: Baron-Cohen 等（ eyes test 读心）
