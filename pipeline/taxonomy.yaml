# ---------------------------------------------------------------------
# 维度二：题型 (Question Type / type_facet)
# 注意：这是用户定义的"主题型"维度，与 command word 是不同维度。
#   P1 → 按"研究切面 / 实验流程阶段"分类（用户 Q4 明确要求）
#   P2 → 暂留空（null）；待后续确定
# ---------------------------------------------------------------------
type_facets:

  p1:                         # Paper 1 题型 = 研究切面（用户 2026-08-30 指定 13 类 + other）
    label_zh: "研究切面 (Research Facets)"
    values:
      - { id: background,              zh: "研究背景 (Background)" }
      - { id: psychology_investigated, zh: "研究的心理学领域 (Psychology Investigated)" }
      - { id: aim,                     zh: "研究目的 (Aim)" }
      - { id: hypothesis,              zh: "假设 (Hypothesis)" }
      - { id: research_method_design,  zh: "研究方法与设计 (Method + Design)" }
      - { id: sample,                  zh: "被试/样本：技术与特征 (Sample)" }
      - { id: procedure,               zh: "程序/步骤 (Procedure)" }
      - { id: result,                  zh: "结果/发现 (Result)" }
      - { id: conclusion,              zh: "结论 (Conclusion)" }
      - { id: strengths_weaknesses,    zh: "优势与不足 (Strengths & Weaknesses)" }
      - { id: application_everyday,    zh: "应用于日常生活 (Application)" }
      - { id: issues_debates,          zh: "议题与辩论 (Issues & Debates)" }
      - { id: approach,                zh: "视角/取向 (Approach)" }
      - { id: other,                   zh: "其他/未分类 (Other)" }

  p2: null                    # Q4：P2 题型分类待定，留空

# ---------------------------------------------------------------------
# 通用 facet（始终可用，不属"主题型"但极具筛选价值）
# ---------------------------------------------------------------------
universal_facets:
  marks: [1, 2, 3, 4, 6, 8, 10]      # 分值（P1/P2 单题 1–10）
  command_words:                     # 官方命令词（P1/P2 通用，作为次级筛选项）
    - { id: define,    zh: "下定义 (Define/State/Identify/Give)" }
    - { id: outline,   zh: "概述 (Outline)" }
    - { id: describe,  zh: "描述 (Describe)" }
    - { id: explain,   zh: "解释 (Explain)" }
    - { id: suggest,   zh: "建议/应用 (Suggest)" }
    - { id: compare,   zh: "比较 (Compare)" }
    - { id: analyse,   zh: "分析 (Analyse)" }
    - { id: evaluate,  zh: "评价 (Evaluate)" }
    - { id: plan,      zh: "计划设计 (Plan)" }
  paper: [P1, P2]
  syllabus_version: ["2024-2026"]
  year: [2024, 2025, 2026]
  session: [m, s, w]        # m=2/3月, s=5/6月, w=10/11月
